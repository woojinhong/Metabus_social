name: Slice 01 PostgreSQL spike

on:
  push:
    branches:
      - "experiment/**"
    paths:
      - "experiments/slice-01-session-postgresql/**"
      - ".github/workflows/slice-01-postgresql-spike.yml"
  pull_request:
    paths:
      - "experiments/slice-01-session-postgresql/**"
      - "docs/reviews/slice-01-session-postgresql-spike-results.md"
      - "docs/discovery/slice-01-session-concurrency-validation.md"
      - ".github/workflows/slice-01-postgresql-spike.yml"

permissions:
  contents: read

jobs:
  verify:
    name: PostgreSQL spike run ${{ matrix.repetition }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        repetition: [1, 2]
    defaults:
      run:
        working-directory: experiments/slice-01-session-postgresql
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v4
      - name: Make Gradle wrapper executable
        shell: bash
        run: chmod +x gradlew
      - name: Verify wrapper, formatting, tests, architecture, and static analysis
        shell: bash
        run: ./gradlew --no-daemon spotlessCheck test spotbugsMain spotbugsTest integrationTest
      - name: Upload safe test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: slice-01-spike-reports-${{ matrix.repetition }}
          path: experiments/slice-01-session-postgresql/build/
          retention-days: 3
